name: Deploy StretchQuest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
        env:
          # Serves from https://<user>.github.io/<repo>/ whatever the repo is named.
          BASE_PATH: /${{ github.event.repository.name }}/
      # Publishes to the gh-pages branch. Enable once under
      # Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: false
