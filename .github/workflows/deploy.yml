name: Deploy StretchQuest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
        env:
          # Serves from https://<user>.github.io/<repo>/ whatever the repo is named.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional. Without them the app builds local-only and the Supabase
          # SDK is dropped from the bundle entirely. Set both under
          # Settings -> Secrets and variables -> Actions to enable accounts.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Legacy fallback; Supabase retires anon keys at the end of 2026.
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Publishes to the gh-pages branch. Enable once under
      # Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: false
