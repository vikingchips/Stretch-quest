; StretchQuest force sensor — Seeed Xiao ESP32-C3.
;
; See ../BRIEF.md.md for wiring and the milestone list. The current source is
; milestone 1 only: an I2C bus scan. Everything else waits for hardware.

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NAU7802 Library
    h2zero/NimBLE-Arduino
    olikraus/U8g2
