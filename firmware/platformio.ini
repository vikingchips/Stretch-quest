; StretchQuest force sensor — Seeed Xiao ESP32-C3.
;
; See ../BRIEF.md.md for wiring and the milestone list, and src/config.h for
; the mode switch (load cell / potentiometer / simulated).

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NAU7802 Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    ; Pinned to the 2.x API line — the callback signatures changed at 2.0,
    ; and progressor.cpp is written against 2.x.
    h2zero/NimBLE-Arduino@^2.1.0
